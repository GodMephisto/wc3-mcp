name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish src/Wc3.Mcp/Wc3.Mcp.csproj -c Release
          --self-contained -r win-x64 -o dist-mcp

      - name: Copy license files
        run: >
          Copy-Item LICENSE -Destination dist-mcp/;
          Copy-Item NOTICE -Destination dist-mcp/;
          Copy-Item THIRD-PARTY-NOTICES.md -Destination dist-mcp/;
          Copy-Item CREDITS.md -Destination dist-mcp/

      - name: Check the exe and CascLib.dll
        run: >
          if (!(Test-Path dist-mcp/wc3-mcp.exe)) { Write-Error "wc3-mcp.exe missing from dist-mcp"; exit 1 }
          if (!(Test-Path dist-mcp/CascLib.dll)) { Write-Error "CascLib.dll missing from dist-mcp"; exit 1 }

      - name: Smoke test the published exe
        run: >
          dist-mcp/wc3-mcp.exe version;
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Create zip and checksum
        run: |
          $zip = "wc3-mcp-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path dist-mcp/* -DestinationPath $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  $zip" -NoNewline -Encoding ascii

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          wc3-mcp-${{ github.ref_name }}-win-x64.zip
          wc3-mcp-${{ github.ref_name }}-win-x64.zip.sha256
          --generate-notes
